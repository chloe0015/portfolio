<style>
:root{--paper:#FEFEFE;--ink:#151515;--inkrgb:21,21,21;--ink2:#454545;--ink3:#8b8985;--acc:#FF6B1A;--tagbg:#151515;--tagink:#FCFCFB;

:root[data-theme="dark"]{--paper:#161616;--ink:#f1efec;--inkrgb:241,239,236;--ink2:#cfcdca;--ink3:#7d7b78;--tagbg:#f1efec;--tagink:#161616;color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono)}
.sheet{position:relative;min-height:100vh;overflow-x:clip}
.layer{position:relative;min-height:100vh;padding-inline:max(30px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px));
 background-color:var(--bg);color:var(--ink);--g1:.035;--g2:.07;
 }
.layer::before,.layer::after{content:"";position:absolute;inset:0;pointer-events:none;background-size:16px 16px,16px 16px,80px 80px,80px 80px;transition:opacity .9s}
.layer::after{background-image:linear-gradient(rgba(var(--inkrgb),.022) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--inkrgb),.022) 1px,transparent 1px),linear-gradient(rgba(var(--inkrgb),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--inkrgb),.045) 1px,transparent 1px);opacity:1}
.layer::before{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);opacity:0}
.boot::before{opacity:1}.boot::after{opacity:0}
.paper{--bg:var(--paper);transition:background-color .9s}
.paper *{transition:color .9s,background-color .9s,border-color .9s}
.paper.boot{--bg:#2B5CF0;background-color:transparent;--ink:#fff;--inkrgb:255,255,255;--ink2:rgba(255,255,255,.8);--ink3:rgba(255,255,255,.55);--tagbg:#fff;--tagink:#2B5CF0;--acc:#fff}
.paper.fast,.paper.fast *,.paper.fast::before,.paper.fast::after{transition-duration:.01s}
.wrap,.rt,.rl{position:relative;z-index:2}
#bg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
.logo{display:flex!important;align-items:center;justify-content:center}
.eyebrow{min-height:1.2em}h1{min-height:.92em;white-space:nowrap}.sub{min-height:1.7em}
.caret{display:inline-block;width:.6ch;height:1.05em;background:currentColor;vertical-align:-.15em;margin-left:1px;animation:cb .7s steps(1) infinite}

@keyframes cb{50%{opacity:0}}
.hero{position:relative}
.box{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;transition:opacity .5s}

.box path.p2{stroke-width:.7;opacity:.4}
.pcn{position:absolute;z-index:5;font:italic 500 10.5px var(--mono);background:rgba(255,255,255,.85);color:#2B5CF0;padding:2px 7px;border-radius:2px;transition:opacity .5s;pointer-events:none}
.box.gone,.pcn.gone{opacity:0}
.sfr{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:1}
.sfr{opacity:1}
#blue{--ink:#fff;--inkrgb:255,255,255;--ink2:rgba(255,255,255,.8);--ink3:rgba(255,255,255,.55);--tagbg:#fff;--tagink:#2B5CF0;--acc:#fff;position:fixed;inset:0;z-index:1;pointer-events:none;background-color:#2B5CF0;transform-origin:0 100%;will-change:transform;
 background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:16px 16px,16px 16px,80px 80px,80px 80px}
.cl2{position:absolute!important;left:0;top:0;width:100%;min-height:0!important;background:none!important;color:#fff;pointer-events:none}
.cl2::before,.cl2::after{display:none!important}
#blue .pf{opacity:1}
#flap,#shd{position:fixed;inset:0;display:none;pointer-events:none}#flap{z-index:6}#shd{z-index:4}#blue .door{display:none}
.pcn.tg{opacity:0;transition:opacity .3s}.pcn.tg.on{opacity:1}
.hd.gone,.pcn.tg.gone{opacity:0}
.sfr path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}

.tblock b,.tblock span{padding:6px 10px}.tblock b{font-weight:700}

.pet.sleep{opacity:0}
.lock .pets{pointer-events:none}
.a{transition:opacity .25s}
.lock .slot:not(.nz) .a{opacity:0}
.pf{position:absolute;left:8px;top:6px;width:calc(100% - 16px);height:calc(100% - 12px);overflow:visible;pointer-events:none;opacity:0;transition:opacity .9s}
.boot .pf{opacity:1}
.pf path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .38s ease-out}
.pf path+path{stroke:rgba(255,255,255,.3);transition-delay:.05s}
.slot.fr .pf path{stroke-dashoffset:0}
.zz .slot::before{content:'+';position:absolute;left:50%;top:calc(50% - 6px);transform:translate(-50%,-50%);font:500 14px/1 var(--mono);color:var(--ink);opacity:.45}
.box .bar{fill:none;stroke:rgba(255,255,255,.62);stroke-width:1;stroke-dasharray:none;stroke-dashoffset:0}

.box .tk{stroke:rgba(255,255,255,.7);stroke-width:1;stroke-dasharray:none;stroke-dashoffset:0}
.door{transition:opacity .5s .3s}.boot .door{opacity:0}

.bpw{position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;overflow:hidden;pointer-events:none;will-change:transform;contain:layout paint}
.spec .bpw{pointer-events:auto}
.bp{--bg:#2B5CF0;--ink:#fff;--inkrgb:255,255,255;--ink2:rgba(255,255,255,.78);--ink3:rgba(255,255,255,.55);--tagbg:#fff;--tagink:#2B5CF0;--g1:.07;--g2:.2;position:absolute;left:0;right:0;top:0;bottom:0;min-height:0;will-change:transform}
/* rulers: measure the real character grid (1 col = 8px, 1 row = 16px) */
.rt,.rl{position:fixed;z-index:6!important;background:var(--bg);pointer-events:none;overflow:hidden}
.rt{left:0;right:0;top:0;height:var(--rule);border-bottom:1px solid rgba(var(--inkrgb),.28);
 background-image:repeating-linear-gradient(90deg,rgba(var(--inkrgb),.4) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(var(--inkrgb),.6) 0 1px,transparent 1px 80px);background-size:100% 5px,100% 10px;background-repeat:no-repeat;background-position:0 100%}
.rl{left:0;top:0;bottom:0;width:var(--rule);border-right:1px solid rgba(var(--inkrgb),.28);
 background-image:repeating-linear-gradient(180deg,rgba(var(--inkrgb),.4) 0 1px,transparent 1px 16px),repeating-linear-gradient(180deg,rgba(var(--inkrgb),.6) 0 1px,transparent 1px 80px);background-size:5px 100%,10px 100%;background-repeat:no-repeat;background-position:100% 0}
.rt b,.rl b{position:absolute;font:500 9px/1 var(--mono);color:var(--ink3)}
.rt b{top:3px}.rl b{left:3px}
.rt i,.rl i{position:absolute;font:700 9px/1 var(--mono);font-style:normal;background:var(--tagbg);color:var(--tagink);padding:3px 4px;opacity:0;transition:opacity .15s}
.rt i{top:0;transform:translateX(-50%)}.rl i{left:0;transform:translateY(-50%)}
.wrap{position:relative;max-width:1100px;margin:0 auto;padding:52px 0 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative}
.logo{width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(var(--inkrgb),.4);font:600 14px var(--pix);color:var(--ink);text-decoration:none}
.navs{display:flex;gap:28px;align-items:center}
.navs a{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-decoration:none}
.paper .navs a:hover{color:var(--ink)}
.hero{padding:56px 0 100px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 20px;width:fit-content}
h1{margin:0 0 18px;font:400 clamp(60px,8.4vw,120px)/.92 var(--serif);letter-spacing:-.03em;width:fit-content}
h1 em{font-style:italic}
.sub{margin:0;font:400 clamp(15px,1.4vw,18px)/1.6 var(--mono);color:var(--ink);max-width:32em;width:fit-content}
.sub i{font-style:normal;color:var(--ink2)}
/* blueprint-only: spec boxes that the real content replaces (instantly, no fade) */
.bp .pw{position:relative;display:block}
.bp .pw .txt{display:block;visibility:hidden}
.bp .pw .ph{transform-origin:0 50%;transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.7,.2,1);position:absolute;inset:-6px -10px;border:1px solid rgba(255,255,255,.45);background:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 1px,transparent 1px 7px);visibility:hidden}
.bp .pw .ph b,.bp .navph b{position:absolute;left:-1px;top:-1px;font:700 10px var(--mono);letter-spacing:.08em;background:var(--tagbg);color:var(--tagink);padding:3px 6px}
.paper .ph,.paper .navph,.paper .co,.paper .cl{display:none}
.bp .navph{position:absolute;top:-2px;height:40px;border:1px dashed rgba(255,255,255,.45);visibility:hidden}
.bp .navph b{transform:translateY(-100%)}
.bp .navph.a{left:48px;width:80px}.bp .navph.b{right:0;width:210px}
.bp.s1 .navph{visibility:visible}
.bp.s2 .pw .ph{visibility:visible;transform:none}
.bp.s5 .pw .ph,.bp.s5 .navph{visibility:hidden}.bp.s5 .pw .txt{visibility:visible}
.bp .navs{visibility:hidden}.bp.s5 .navs{visibility:visible}
/* callouts: each one measures a real element */
.cl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cl line,.cl path{stroke:#fff;stroke-width:1;fill:none}
.cl rect{fill:#fff}
.co{position:absolute;font:600 10.5px var(--mono);letter-spacing:.04em;background:#fff;color:#2B5CF0;padding:4px 7px;white-space:nowrap;visibility:hidden}
.bp.s4 .co,.bp.s4 .cl{visibility:visible}
.bp .cl{visibility:hidden}
/* pets */
.pets{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center;padding-bottom:12px;transition:background .2s,box-shadow .2s}
.bp .slot{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3);opacity:0;transition:opacity .25s;transition-delay:calc(var(--r)*120ms)}
.bp.s3 .slot{opacity:1}
.paper .slot:hover{background:rgba(var(--inkrgb),.04);box-shadow:inset 0 0 0 1px rgba(var(--inkrgb),.4)}
.pet{all:unset;display:block;position:relative;cursor:pointer;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.bp .pet{cursor:default}
.pet:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.a{margin:0;font:500 var(--fs)/1.16 var(--mono);color:var(--ink);white-space:pre;text-align:left;user-select:none;-webkit-user-select:none;width:7ch}
.a .c{display:inline-block}
.a .e{color:var(--acc)}
.bp .a .e{color:var(--ink)}
.bp .a{opacity:0;transition:opacity .01s linear;transition-delay:calc(var(--d)*1ms)}
.bp.s4 .a{opacity:1}
.door{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font:600 9px/1 var(--pix);letter-spacing:.05em;background:var(--tagbg);color:var(--tagink);padding:3px 4px;white-space:nowrap;pointer-events:none}
.bp .door{display:none}
.ctl{position:fixed;left:max(30px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;gap:12px;z-index:30}
.ctl button{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1px solid rgba(var(--inkrgb),.4);padding:8px 12px;cursor:pointer}
.ctl button:hover{border-color:var(--ink)}
.ctl button[disabled]{opacity:.4;cursor:default}
#skip{position:fixed;right:200px;bottom:max(24px,env(safe-area-inset-bottom,0px));font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;z-index:40;pointer-events:none;transition:opacity .3s}
.peel ~ #skip,.done ~ #skip,.spec ~ #skip{opacity:0}
#pct{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:flex;align-items:center;gap:8px;font:700 11px var(--mono);transition:opacity .3s}
#pct i{width:12px;height:12px;border-radius:50%;background:#38BDF8;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
#pct b{background:#fff;color:#2B5CF0;padding:3px 6px;letter-spacing:.05em}
.peel ~ #pct,.done ~ #pct,.spec ~ #pct{opacity:0}
#edge{will-change:transform;position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 0 1px rgba(43,92,240,.6),0 0 22px rgba(255,255,255,.9);z-index:11;opacity:0;pointer-events:none;top:0}
#tip{position:fixed;left:0;top:0;z-index:40;background:var(--tagbg);color:var(--tagink);font:500 10.5px/1.5 var(--mono);letter-spacing:.03em;padding:6px 8px;white-space:pre;pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--tagbg);color:var(--tagink);font:600 12px var(--mono);letter-spacing:.06em;padding:10px 14px;transition:opacity .25s,transform .25s;z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
@media (max-width:760px){
.tblock{display:none}
:root{--rule:16px}
.layer{padding-inline:max(22px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.rl{display:none}.layer{padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.wrap{padding-top:36px}
.pets{grid-template-columns:repeat(6,minmax(0,1fr))}

</style>

<style>
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal;animation-duration:.6s;animation-timing-function:cubic-bezier(.65,0,.25,1);animation-fill-mode:both}
::view-transition-old(root){animation-name:vt-old-down}

@keyframes vt-old-down{to{transform:translateY(-100%)}}

<body>
<div class="sheet" id="sheet">
<div id="blue" aria-hidden="true"></div>
<div class="layer paper boot" id="paper"></div>
</div>
<div class="ctl"><button id="snd" type="button" aria-pressed="true">Sound: on</button><button id="rep" type="button">↻ Replay</button></div>
<div id="skip">click anywhere to skip</div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
var ANIMALS={
owl:{lines:[",___,","{0,0}","/)_)",'" "'],eye:1},
cat:{lines:["/\\_/\\","( o.o )","> ^ <"],eye:1},
bunny:{lines:["(\\_/)","(o.o)",'(")_(")'],eye:1},
frog:{lines:["@..@","(----)","( >< )","^^  ^^"],eye:0},
penguin:{lines:["(o>","//\\","V_/_"],eye:0},
fish:{lines:["o","><(((o>"],eye:1}
};
var TYPES=['owl','cat','bunny','frog','penguin','fish'];
var SND={owl:[[392,.08],[523,.14]],cat:[[660,.06],[880,.06],[660,.1]],frog:[[196,.08],[262,.08],[196,.12]],bunny:[[784,.05],[988,.05],[1175,.09]],penguin:[[330,.1],[247,.16]],fish:[[523,.05],[659,.05],[784,.05],[1047,.1]]};
var DOORS={2:['NETEASE','explode'],8:['DDOT VOICE','fly'],13:['DEEPBRAIN','wiggle'],16:['AI LABELING','hop']};
var COLS=(matchMedia('(max-width:760px)').matches?6:10),ROWS=(COLS===6?3:2),N=COLS*ROWS,BW=7;
var PALETTE=['#FF6B1A','#F0574D','#4FD1A1','#6C8CFF','#B48CFF'],ACC=(function(){try{var a=localStorage.getItem('cz-accent');if(a&&PALETTE.indexOf(a.toUpperCase())>=0)return a.toUpperCase()}catch(e){}return PALETTE[Math.floor(Math.random()*PALETTE.length)]})();
function setAcc(c){ACC=c;document.documentElement.style.setProperty('--acc',ACC);try{localStorage.setItem('cz-accent',ACC)}catch(e){}}
function cycleAccent(){setAcc(PALETTE[(PALETTE.indexOf(ACC)+1)%PALETTE.length])}
setAcc(ACC);
var ORDER=(function(){var seed=7,rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647},a;
 for(var tries=0;tries<500;tries++){a=[];var ok=true;
  for(var i=0;i<20&&ok;i++){var opts=[0,1,2,3,4,5].filter(function(t){return !(i>0&&a[i-1]===t)&&!(i>=6&&a[i-6]===t)&&!(i>=10&&a[i-10]===t)});if(!opts.length){ok=false;break}a.push(opts[Math.floor(rnd()*opts.length)])}
  if(ok){var cnt={};a.forEach(function(t){cnt[t]=(cnt[t]||0)+1});if(Object.keys(cnt).length===6)return a}}
 return a})();
function typeOf(i){return TYPES[ORDER[i]]}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function art(type,i,bp){
 var A=ANIMALS[type],html='';
 A.lines.forEach(function(ln,li){
  var pad=Math.floor((BW-ln.length)/2);if(pad<0)pad=0;html+=new Array(pad+1).join(' ');
  for(var x=0;x<ln.length;x++){var ch=ln.charAt(x),isEye=(li===A.eye&&/[0o@]/.test(ch)&&!(type==='fish'&&ln.length===1&&false));
   if(ch===' '){html+=' ';continue}
   html+='<span class="c'+(isEye?' e':'')+'"'+(isEye?' data-eye="'+esc(ch)+'"':'')+'>'+esc(ch)+'</span>';
  }
  html+='\n';
 });
 var d=Math.floor(i/COLS)*110+(i%COLS)*16;
 return '<pre class="a"'+(bp?' style="--d:'+d+'"':'')+'>'+html.replace(/\n$/,'')+'</pre>';
}
function pf(){
 function j(n){return ((Math.random()-.5)*n).toFixed(1)}
 function path(o){var P=[[3,3],[97,3],[97,97],[3,97],[3,3]],d='';
  for(var k=0;k<4;k++){var a=P[k],b=P[k+1];for(var u=0;u<=4;u++){var t=u/4,x=a[0]+(b[0]-a[0])*t+(u&&u<4?+j(2.4):0)+o,y=a[1]+(b[1]-a[1])*t+(u&&u<4?+j(2.4):0)+o;d+=(k+u?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}}
  return '<path pathLength="1" d="'+d+'"/>'}
 return '<svg class="pf" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+path(0)+path(1.8)+'</svg>'}

  for(var k=0;k<4;k++){var a=C[k],b=C[k+1];for(var u=0;u<=5;u++){var t=u/5;d+=(k+u?'L':'M')+(a[0]+(b[0]-a[0])*t+(u&&u<5?j(1.2):0)+o).toFixed(1)+' '+(a[1]+(b[1]-a[1])*t+(u&&u<5?j(1.2):0)+o).toFixed(1)}}
  html+='<path pathLength="1" class="'+cls+'" d="'+d+'"/>'}
 var lg=top.querySelector('.logo').getBoundingClientRect(),nv=top.querySelector('.navs').getBoundingClientRect();
 rect(lg,0,'');rect(lg,1.5,'p2');rect(nv,0,'');rect(nv,1.5,'p2');

 var t0=document.getElementById('tg0'),t1=document.getElementById('tg1');
 t0.style.left=(lg.left-T0.left-8)+'px';t0.style.top=(lg.top-T0.top-26)+'px';t1.style.left=(nv.left-T0.left-8)+'px';t1.style.top=(nv.top-T0.top-26)+'px';
}
function setHd(p){
 hdP.forEach(function(el,i){var g=Math.floor(i/2),a=g?.07:.02,u=Math.max(0,Math.min(1,(p-a)/.12));if(i%2)u=Math.max(0,u-.08);el.style.strokeDashoffset=1-u});

}

 var q=Math.min(1,p/.88);

/* pets: glyph noise on the blue sheet, generated when it turns white */
var GL='01#%&@+=<>/\\|*:;~?$'.split(''),rg=function(){return GL[Math.floor(Math.random()*GL.length)]};
var nodes=[],shown=[],TH=[];
function slots(){return [].slice.call(paper.querySelectorAll('.slot'))}
function planPets(){var idx=pets.map(function(p,i){return i}).sort(function(){return Math.random()-.5});TH=[];idx.forEach(function(i,r){TH[i]=.06+r/pets.length*.78});shown=pets.map(function(){return false})}

function initNodes(){nodes=[].map.call(paper.querySelectorAll('.pet .c'),function(sp){

  wake.push(setTimeout(function(){[].forEach.call(p.el.querySelectorAll('.e'),function(e){e.textContent=e.getAttribute('data-eye')});
   if(++n===pets.length){state='done';paper.classList.remove('lock');startBlink()}},fast?0:j*20+Math.random()*60))});
}
function run(){
 var st=performance.now(),last=[-1,-1,-1],faded=false,fadeT=0,lastS=0,closed=false,woke=false;
 (function f(now){
  if(state==='done'||state==='skipped')return;
  var p=Math.min(1,(now-st)/DUR);
  if(!closed){
   var tp=Math.min(1,p/.92),ks=[0,0,0],ch=false;
   for(var e=0;e<3;e++){var w=tp*WE[e],k=0;while(k<opsE[e].length&&cumE[e][k]<=w)k++;ks[e]=k;if(k!==last[e]){ch=true;last[e]=k}}
   if(ch)render(ks);
   setProg(p);
   for(var i=0;i<pets.length;i++)if(!shown[i]&&p>=TH[i])showPet(i);
   if(!faded&&p>.88){for(var q=0;q<pets.length;q++)showPet(q);faded=true;fadeT=now;
    carets.forEach(function(c){c.remove()});render(FULL);setProg(1);
    var lay=document.createElement('div');lay.className='layer cl2';lay.appendChild(paper.querySelector('.wrap').cloneNode(true));blue.appendChild(lay);
    blue.style.zIndex=5;
    [boxEl,pcn,paper.querySelector('#hd'),paper.querySelector('#tg0'),paper.querySelector('#tg1')].forEach(function(e){e.classList.add('gone')});
    paper.classList.add('fast');paper.classList.remove('boot');setTimeout(function(){paper.classList.remove('fast')},140);
    curlStart();
    nodes.forEach(function(n){n.at=fadeT+150+(n.x*.5+Math.random()*.5)*850})}
   if(p>=1){closed=true;carets.forEach(function(c){c.remove()});render(FULL);setProg(1);boxEl.classList.add('gone');pcn.classList.add('gone')}
  }
  if(now-lastS>65){lastS=now;nodes.forEach(function(n){if(n.done)return;if(faded&&now>=n.at){n.done=true;n.el.textContent=n.eye?'-':n.o}else n.el.textContent=rg()})}
  var all=faded&&nodes.every(function(n){return n.done});
  if(all&&closed&&!woke){woke=true;state='moving';wakeEyes(false);return}
  raf=requestAnimationFrame(f);
 })(st);
}
function skip(){if(state!=='intro')return;cancelAnimationFrame(raf);state='skipped';paper.classList.add('fast');
 carets.forEach(function(c){c.remove()});render(FULL);setProg(1);boxEl.classList.add('gone');pcn.classList.add('gone');
 nodes.forEach(function(n){n.done=true;n.el.textContent=n.o});slots().forEach(function(sl){sl.classList.add('fr','nz')});paper.classList.remove('boot');curlReset(true);[].slice.call(blue.querySelectorAll('.cl2')).forEach(function(e){e.remove()});
 wake.forEach(clearTimeout);state='done';paper.classList.remove('lock');startBlink();setTimeout(function(){paper.classList.remove('fast')},80)}
function play(){
 cancelAnimationFrame(raf);stopBlink();wake.forEach(clearTimeout);wake=[];
 pets.forEach(function(p){p.busy=false;p.el.style.visibility='visible';p.el.getAnimations().forEach(function(a){a.cancel()})});
  curlReset(false);blue.style.display='';blue.style.zIndex='';[].slice.call(blue.querySelectorAll('.cl2')).forEach(function(e){e.remove()});[boxEl,pcn,paper.querySelector('#hd'),paper.querySelector('#tg0'),paper.querySelector('#tg1')].forEach(function(e){if(e)e.classList.remove('gone')});paper.classList.remove('peel');paper.classList.add('fast','boot','lock');state='intro';document.getElementById('skip').style.opacity=1;
 if(!nodes.length)initNodes();resetNodes();slots().forEach(function(sl){sl.classList.remove('fr','nz')});planPets();buildFrame();buildBox();buildHeader();setProg(0);
 requestAnimationFrame(function(){requestAnimationFrame(function(){paper.classList.remove('fast');setTimeout(function(){run()},200)})});
}
els=[document.getElementById('ty0'),document.getElementById('ty1'),document.getElementById('ty2')];
document.addEventListener('click',skip);
document.addEventListener('keydown',skip);
document.getElementById('rep').onclick=function(e){e.stopPropagation();play()};
addEventListener('resize',function(){fxSize();if(boxEl&&state==='intro'){buildFrame();buildBox();buildHeader();setProg(0)}});

if(window.ARR){instant()}else{(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){play()})}
})();
